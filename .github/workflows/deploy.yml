# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Privacy metadata gate
        env:
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:privacy -- --check-range "$PRIVACY_BASE_SHA" "$PRIVACY_HEAD_SHA"

      - name: Quality gate and build
        run: npm run check

      - name: Type-check E2E
        run: npm run typecheck:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, accessibility, PWA, and CSP tests
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Setup Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
